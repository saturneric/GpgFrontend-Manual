name: CI

# For all pushes to the main branch run the tests and push the image to the
# GitHub registry under an edge tag so we can use it for the nightly
# integration tests
on:
  push:
    branches: ["main"]

jobs:
  docker:
    runs-on: ubuntu-latest-server
    uses: Pub/workflows/.gitea/workflows/docker-build.yaml@v0.0.3
    with:
      image: gpgfrontend/manual
      registry: git.stdv.de
      # Gitea 1.27 does not materialize workflow_call input defaults, so every
      # input has to be passed explicitly by the caller.
      checkout: true
      push: true
      context: "."
      dockerfile: "Dockerfile"
      platforms: "linux/amd64"
    secrets:
      REGISTRY_USER: ${{ secrets.DOCKER_USERNAME }}
      REGISTRY_PASS: ${{ secrets.DOCKER_PASSWORD }}
